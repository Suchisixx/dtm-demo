  <text x="460" y="211" text-anchor="middle" font-size="11" font-weight="600" fill="#0F172A">Công suất &gt; 0?</text>
  <rect x="670" y="175" width="220" height="50" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" rx="6" ry="6" stroke-dasharray="none" />
  <text x="780" y="197.5" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">DỪNG: Trạng thái NEEDS_REVIEW</text>
  <text x="780" y="212.5" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">(Thông số không hợp lệ)</text>
  <rect x="320" y="280" width="280" height="55" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" rx="6" ry="6" stroke-dasharray="none" />
  <text x="460" y="305" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">So khớp công suất với Bảng ngưỡng quy mô</text>
  <text x="460" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">=&gt; Xác định Nhóm ban đầu (Nhóm I, II, III, IV)</text>
  <polygon points="460,375 570,420 460,465 350,420" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" stroke-dasharray="none" />
  <text x="460" y="417" text-anchor="middle" font-size="11" font-weight="600" fill="#0F172A">Có yếu tố nhạy cảm môi trường?</text>
  <text x="460" y="431" text-anchor="middle" font-size="11" font-weight="600" fill="#0F172A">(Ven biển, bảo tồn, rừng, xả thải lớn)</text>
  <rect x="670" y="395" width="230" height="50" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" rx="6" ry="6" stroke-dasharray="none" />
  <text x="785" y="417.5" text-anchor="middle" font-size="11" font-weight="700" fill="#B45309">Áp dụng quy tắc nâng nhóm:</text>
  <text x="785" y="432.5" text-anchor="middle" font-size="11" font-weight="700" fill="#B45309">Nhóm III -&gt; Nhóm II | Nhóm II -&gt; Nhóm I</text>
  <rect x="320" y="510" width="280" height="75" fill="#ECFDF5" stroke="#059669" stroke-width="1.5" rx="6" ry="6" stroke-dasharray="none" />
  <text x="460" y="530" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Xác định loại hồ sơ môi trường:</text>
  <text x="460" y="545" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">• Nhóm I &amp; II: Báo cáo ĐTM &amp; Giấy phép GPMT</text>
  <text x="460" y="560" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">• Nhóm III: Giấy phép GPMT / Đăng ký ĐKMT</text>
  <text x="460" y="575" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">• Nhóm IV: Đăng ký môi trường ĐKMT</text>
  <rect x="320" y="625" width="280" height="55" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5" rx="6" ry="6" stroke-dasharray="none" />
  <text x="460" y="650" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Xác định cấp thẩm quyền phê duyệt:</text>
  <text x="460" y="665" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Bộ Nông nghiệp &amp; MT / UBND Tỉnh / Cấp Xã</text>
  <ellipse cx="460" cy="747.5" rx="160" ry="27.5" fill="#286B4F" stroke="#1E563F" stroke-width="1.5" stroke-dasharray="none" />
  <text x="460" y="751.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">Kết thúc: Xuất kết quả phân loại &amp; Checklist hồ sơ</text>
  <line x1="460" y1="125" x2="460" y2="160" stroke="#334155" stroke-width="1.5"  marker-end="url(#arrow)" />
  <line x1="560" y1="200" x2="670" y2="200" stroke="#DC2626" stroke-width="1.5"  marker-end="url(#arrow-red)" />
  <text x="615" y="199" text-anchor="middle" font-size="10" font-weight="600" fill="#DC2626">Không</text>
  <line x1="460" y1="240" x2="460" y2="280" stroke="#16A34A" stroke-width="1.5"  marker-end="url(#arrow-green)" />
  <rect x="428" y="247" width="64" height="16" fill="#FFFFFF" rx="2" />
  <text x="460" y="259" text-anchor="middle" font-size="10" font-weight="600" fill="#16A34A">Hợp lệ</text>
  <line x1="460" y1="335" x2="460" y2="375" stroke="#2563EB" stroke-width="1.5"  marker-end="url(#arrow-blue)" />
  <line x1="570" y1="420" x2="670" y2="420" stroke="#334155" stroke-width="1.5"  marker-end="url(#arrow)" />
  <text x="620" y="419" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Có</text>
  <line x1="460" y1="465" x2="460" y2="510" stroke="#16A34A" stroke-width="1.5"  marker-end="url(#arrow-green)" />
  <rect x="428" y="474.5" width="64" height="16" fill="#FFFFFF" rx="2" />
  <text x="460" y="486.5" text-anchor="middle" font-size="10" font-weight="600" fill="#16A34A">Không</text>
  <line x1="670" y1="420" x2="600" y2="547.5" stroke="#334155" stroke-width="1.5"  marker-end="url(#arrow)" />
  <line x1="460" y1="585" x2="460" y2="625" stroke="#16A34A" stroke-width="1.5"  marker-end="url(#arrow-green)" />
  <line x1="460" y1="680" x2="460" y2="720" stroke="#334155" stroke-width="1.5"  marker-end="url(#arrow)" />
