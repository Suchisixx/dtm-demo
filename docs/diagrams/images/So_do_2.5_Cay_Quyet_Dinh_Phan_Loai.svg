  <text x="475" y="43.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0F172A">SƠ ĐỒ 2.5: LƯU ĐỒ CÂY QUYẾT ĐỊNH PHÂN LOẠI HỒ SƠ MÔI TRƯỜNG</text>
  <ellipse cx="460" cy="97.5" rx="160" ry="27.5" fill="#286B4F" stroke="#1E563F" stroke-width="1.5" stroke-dasharray="none" />
  <text x="460" y="94.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">Bắt đầu: Nhập thông số dự án</text>
  <text x="460" y="109.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">(Ngành nghề, công suất, vị trí, yếu tố nhạy cảm)</text>
  <polygon points="460,160 560,200 460,240 360,200" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" stroke-dasharray="none" />
