<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="1200" height="670">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#16A34A"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <marker id="generalization" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="2,2 10,6 2,10" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <rect x="100" y="20" width="1000" height="35" fill="none" stroke="none" stroke-width="1.5" rx="6" ry="6" stroke-dasharray="none" />
  <text x="600" y="43.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0F172A">SƠ ĐỒ MÔ HÌNH HÓA TỪ YÊU CẦU THỰC TẾ ĐẾN CHỨC NĂNG HỆ THỐNG</text>
  <rect x="35" y="70" width="330" height="570" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8" rx="6" ry="6" stroke-dasharray="5, 4" />
  <text x="200" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#D97706">1. BÀI TOÁN &amp; YÊU CẦU THỰC TẾ</text>
  <rect x="435" y="70" width="330" height="570" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8" rx="6" ry="6" stroke-dasharray="5, 4" />
  <text x="600" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">2. GIẢI PHÁP MÔ HÌNH HÓA</text>
  <rect x="835" y="70" width="330" height="570" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.8" rx="6" ry="6" stroke-dasharray="5, 4" />
  <text x="1000" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#16A34A">3. CHỨC NĂNG TRONG HỆ THỐNG</text>
  <rect x="55" y="115" width="290" height="78" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" rx="6" ry="6" stroke-dasharray="none" />
  <text x="200" y="151.5" text-anchor="middle" font-size="11" font-weight="400" fill="#0F172A">Tra cứu thủ công nhiều văn bản để xác định</text>
  <text x="200" y="166.5" text-anchor="middle" font-size="11" font-weight="400" fill="#0F172A">loại hồ sơ và thẩm quyền gây tốn thời gian</text>
  <rect x="455" y="115" width="290" height="78" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" rx="6" ry="6" stroke-dasharray="none" />
  <text x="600" y="151.5" text-anchor="middle" font-size="11" font-weight="400" fill="#0F172A">Chuẩn hóa quy định thành tập quy tắc</text>
  <text x="600" y="166.5" text-anchor="middle" font-size="11" font-weight="400" fill="#0F172A">và xây dựng bộ suy diễn cây quyết định</text>
  <rect x="855" y="115" width="290" height="78" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.8" rx="6" ry="6" stroke-dasharray="none" />
  <text x="1000" y="151.5" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Chức năng Phân loại hồ sơ môi trường</text>
  <text x="1000" y="166.5" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">(Xác định nhóm, hồ sơ, thẩm quyền &amp; căn cứ)</text>
  <rect x="55" y="220" width="290" height="78" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" rx="6" ry="6" stroke-dasharray="none" />
  <text x="200" y="256.5" text-anchor="middle" font-size="11" font-weight="400" fill="#0F172A">So sánh thủ công số liệu quan trắc chất thải</text>
  <text x="200" y="271.5" text-anchor="middle" font-size="11" font-weight="400" fill="#0F172A">với các bảng quy chuẩn kỹ thuật dễ sai sót</text>
  <rect x="455" y="220" width="290" height="78" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" rx="6" ry="6" stroke-dasharray="none" />
  <text x="600" y="256.5" text-anchor="middle" font-size="11" font-weight="400" fill="#0F172A">Cấu trúc hóa bảng giới hạn thông số</text>
  <text x="600" y="271.5" text-anchor="middle" font-size="11" font-weight="400" fill="#0F172A">và tự động tính toán mức đạt hoặc vượt chuẩn</text>
  <rect x="855" y="220" width="290" height="78" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.8" rx="6" ry="6" stroke-dasharray="none" />
  <text x="1000" y="256.5" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Chức năng Đối chiếu quy chuẩn kỹ thuật</text>
  <text x="1000" y="271.5" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">(Đánh giá mẫu quan trắc &amp; xuất báo cáo)</text>
  <rect x="55" y="325" width="290" height="78" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" rx="6" ry="6" stroke-dasharray="none" />
  <text x="200" y="361.5" text-anchor="middle" font-size="11" font-weight="400" fill="#0F172A">Văn bản pháp luật thường xuyên sửa đổi,</text>
  <text x="200" y="376.5" text-anchor="middle" font-size="11" font-weight="400" fill="#0F172A">cập nhật thủ công dễ bỏ sót quy định mới</text>
  <rect x="455" y="325" width="290" height="78" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" rx="6" ry="6" stroke-dasharray="none" />
  <text x="600" y="361.5" text-anchor="middle" font-size="11" font-weight="400" fill="#0F172A">Thu thập tự động văn bản từ nguồn trực tuyến</text>
  <text x="600" y="376.5" text-anchor="middle" font-size="11" font-weight="400" fill="#0F172A">kết hợp bước quản trị viên duyệt quy tắc</text>
  <rect x="855" y="325" width="290" height="78" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.8" rx="6" ry="6" stroke-dasharray="none" />
  <text x="1000" y="361.5" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Chức năng Tra cứu &amp; Đồng bộ pháp lý</text>
  <text x="1000" y="376.5" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">(Thư viện luật, quét cập nhật &amp; duyệt quy tắc)</text>
  <rect x="55" y="430" width="290" height="78" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" rx="6" ry="6" stroke-dasharray="none" />
  <text x="200" y="466.5" text-anchor="middle" font-size="11" font-weight="400" fill="#0F172A">Thiếu công cụ trực quan quản lý vị trí dự án</text>
  <text x="200" y="481.5" text-anchor="middle" font-size="11" font-weight="400" fill="#0F172A">và kiểm tra khoảng cách tới vùng nhạy cảm</text>
  <rect x="455" y="430" width="290" height="78" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" rx="6" ry="6" stroke-dasharray="none" />
  <text x="600" y="466.5" text-anchor="middle" font-size="11" font-weight="400" fill="#0F172A">Lưu trữ tọa độ địa lý, tính khoảng cách</text>
  <text x="600" y="481.5" text-anchor="middle" font-size="11" font-weight="400" fill="#0F172A">không gian và hiển thị trên bản đồ tương tác</text>
  <rect x="855" y="430" width="290" height="78" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.8" rx="6" ry="6" stroke-dasharray="none" />
  <text x="1000" y="466.5" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Chức năng Quản lý dự án &amp; Bản đồ số</text>
  <text x="1000" y="481.5" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">(Định vị dự án, vùng đệm &amp; lọc theo khu vực)</text>
  <rect x="55" y="535" width="290" height="78" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" rx="6" ry="6" stroke-dasharray="none" />
  <text x="200" y="571.5" text-anchor="middle" font-size="11" font-weight="400" fill="#0F172A">Khó theo dõi thời hạn báo cáo, quan trắc</text>
  <text x="200" y="586.5" text-anchor="middle" font-size="11" font-weight="400" fill="#0F172A">định kỳ của nhiều dự án và thiếu số liệu tổng hợp</text>
  <rect x="455" y="535" width="290" height="78" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" rx="6" ry="6" stroke-dasharray="none" />
  <text x="600" y="571.5" text-anchor="middle" font-size="11" font-weight="400" fill="#0F172A">Mô hình hóa chu kỳ nghĩa vụ, tự động</text>
  <text x="600" y="586.5" text-anchor="middle" font-size="11" font-weight="400" fill="#0F172A">quét hạn mỗi ngày và tổng hợp biểu đồ</text>
  <rect x="855" y="535" width="290" height="78" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.8" rx="6" ry="6" stroke-dasharray="none" />
  <text x="1000" y="571.5" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Chức năng Nhắc hạn tuân thủ &amp; Thống kê</text>
  <text x="1000" y="586.5" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">(Cảnh báo thời hạn, biểu đồ &amp; nhật ký hệ thống)</text>
  <line x1="345" y1="154" x2="455" y2="154" stroke="#2563EB" stroke-width="1.5"  marker-end="url(#arrow-blue)" />
  <text x="400" y="153" text-anchor="middle" font-size="10" font-weight="600" fill="#2563EB">Mô hình hóa</text>
  <line x1="745" y1="154" x2="855" y2="154" stroke="#16A34A" stroke-width="1.5"  marker-end="url(#arrow-green)" />
  <text x="800" y="153" text-anchor="middle" font-size="10" font-weight="600" fill="#16A34A">Hiện thực hóa</text>
  <line x1="345" y1="259" x2="455" y2="259" stroke="#2563EB" stroke-width="1.5"  marker-end="url(#arrow-blue)" />
  <text x="400" y="258" text-anchor="middle" font-size="10" font-weight="600" fill="#2563EB">Mô hình hóa</text>
  <line x1="745" y1="259" x2="855" y2="259" stroke="#16A34A" stroke-width="1.5"  marker-end="url(#arrow-green)" />
  <text x="800" y="258" text-anchor="middle" font-size="10" font-weight="600" fill="#16A34A">Hiện thực hóa</text>
  <line x1="345" y1="364" x2="455" y2="364" stroke="#2563EB" stroke-width="1.5"  marker-end="url(#arrow-blue)" />
  <text x="400" y="363" text-anchor="middle" font-size="10" font-weight="600" fill="#2563EB">Mô hình hóa</text>
  <line x1="745" y1="364" x2="855" y2="364" stroke="#16A34A" stroke-width="1.5"  marker-end="url(#arrow-green)" />
  <text x="800" y="363" text-anchor="middle" font-size="10" font-weight="600" fill="#16A34A">Hiện thực hóa</text>
  <line x1="345" y1="469" x2="455" y2="469" stroke="#2563EB" stroke-width="1.5"  marker-end="url(#arrow-blue)" />
  <text x="400" y="468" text-anchor="middle" font-size="10" font-weight="600" fill="#2563EB">Mô hình hóa</text>
  <line x1="745" y1="469" x2="855" y2="469" stroke="#16A34A" stroke-width="1.5"  marker-end="url(#arrow-green)" />
  <text x="800" y="468" text-anchor="middle" font-size="10" font-weight="600" fill="#16A34A">Hiện thực hóa</text>
  <line x1="345" y1="574" x2="455" y2="574" stroke="#2563EB" stroke-width="1.5"  marker-end="url(#arrow-blue)" />
  <text x="400" y="573" text-anchor="middle" font-size="10" font-weight="600" fill="#2563EB">Mô hình hóa</text>
  <line x1="745" y1="574" x2="855" y2="574" stroke="#16A34A" stroke-width="1.5"  marker-end="url(#arrow-green)" />
  <text x="800" y="573" text-anchor="middle" font-size="10" font-weight="600" fill="#16A34A">Hiện thực hóa</text>
</svg>
