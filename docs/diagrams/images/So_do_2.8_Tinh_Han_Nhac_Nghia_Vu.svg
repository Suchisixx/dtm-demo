  <text x="470" y="540" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Cập nhật bảng reminders &amp; Tổng hợp KPI Dashboard</text>
  <text x="470" y="555" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">(Hiển thị thẻ cảnh báo và thông tin hạn nộp)</text>
