  <text x="475" y="43.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0F172A">SƠ ĐỒ 2.8: LƯU ĐỒ TÍNH HẠN VÀ PHÂN MỨC CẢNH BÁO NGHĨA VỤ MÔI TRƯỜNG</text>
  <ellipse cx="470" cy="97.5" rx="170" ry="27.5" fill="#286B4F" stroke="#1E563F" stroke-width="1.5" stroke-dasharray="none" />
  <text x="470" y="94.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">Bắt đầu: Tác vụ cron chạy ngầm định kỳ hàng ngày (00:00)</text>
  <text x="470" y="109.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">Đọc danh mục dự án &amp; nghĩa vụ định kỳ trong CSDL</text>
  <rect x="310" y="165" width="320" height="55" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" rx="6" ry="6" stroke-dasharray="none" />
  <text x="470" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Tính mốc thời hạn đến hạn tiếp theo (T_due)</text>
  <text x="470" y="205" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">và khoảng cách số ngày còn lại: Δt = T_due - T_hien_tai</text>
  <polygon points="470,260 570,300 470,340 370,300" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" stroke-dasharray="none" />
