  <g id="start"><rect x="350" y="76" width="200" height="42" rx="21" ry="21" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.6"/>
    <text x="450" y="101.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">Bắt đầu</text></g>
  <g id="io_in"><polygon points="296,145 620,145 604,201 280,201" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
    <text x="450" y="169.2" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Nhập thông tin dự án:</text>
    <text x="450" y="185.2" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Ngành nghề, công suất, vị trí, KCN, yếu tố nhạy cảm</text></g>
  <g id="db_rule">
      <path d="M 295 236 L 295 280 A 155 8 0 0 0 605 280 L 605 236 Z" fill="#F3E8FF" stroke="#6D28D9" stroke-width="1.5"/>
      <ellipse cx="450" cy="236" rx="155" ry="8" fill="#F3E8FF" stroke="#6D28D9" stroke-width="1.5"/>
    
    <text x="450" y="257.275" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">Truy vấn danh mục ngành &amp; ngưỡng</text>
    <text x="450" y="272.775" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">(nganh_nghe, nguong_phan_loai, phu_luc_phap_ly)</text></g>
  <g id="dec_valid"><polygon points="450,318 580,355 450,392 320,355" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.5"/>
    <text x="450" y="351.275" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">Ngành, công suất,</text>
    <text x="450" y="366.775" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">công đoạn hợp lệ?</text></g>
  <g id="warn_rev"><rect x="660" y="323" width="250" height="64" rx="6" ry="6" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
    <text x="785" y="351.275" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7F1D1D">Gắn trạng thái NEEDS_REVIEW</text>
    <text x="785" y="366.775" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7F1D1D">Không suy đoán / không tự chốt</text></g>
  <g id="proc_tier"><rect x="285" y="422" width="330" height="58" rx="6" ry="6" fill="#F8FAFC" stroke="#334155" stroke-width="1.5"/>
    <text x="450" y="447.2" text-anchor="middle" font-size="12" font-weight="500" fill="#111827">So sánh công suất với bảng ngưỡng (first-match)</text>
    <text x="450" y="463.2" text-anchor="middle" font-size="12" font-weight="500" fill="#111827">→ Xác định Nhóm dự án ban đầu (I / II / III / IV)</text></g>
  <g id="proc_extra"><rect x="285" y="506" width="330" height="58" rx="6" ry="6" fill="#F8FAFC" stroke="#334155" stroke-width="1.5"/>
    <text x="450" y="531.2" text-anchor="middle" font-size="12" font-weight="500" fill="#111827">Áp dụng quy tắc bổ sung (vị trí, KCN, xả thải)</text>
    <text x="450" y="547.2" text-anchor="middle" font-size="12" font-weight="500" fill="#111827">&amp; kiểm tra yếu tố nhạy cảm (nâng nhóm nếu có)</text></g>
  <g id="proc_map"><rect x="285" y="590" width="330" height="62" rx="6" ry="6" fill="#F8FAFC" stroke="#334155" stroke-width="1.5"/>
    <text x="450" y="617.2" text-anchor="middle" font-size="12" font-weight="500" fill="#111827">Ánh xạ sang Hồ sơ (ĐTM / GPMT / ĐKMT),</text>
    <text x="450" y="633.2" text-anchor="middle" font-size="12" font-weight="500" fill="#111827">Thẩm quyền &amp; truy vết căn cứ (luat, phu_luc_phap_ly)</text></g>
  <g id="dec_ver"><polygon points="450,682 580,718 450,754 320,718" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.5"/>
    <text x="450" y="714.275" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">Quy tắc &amp; nhạy cảm</text>
    <text x="450" y="729.775" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">đã xác minh pháp lý?</text></g>
  <g id="warn_ver"><rect x="660" y="686" width="250" height="64" rx="6" ry="6" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
    <text x="785" y="714.275" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7F1D1D">Kết luận tạm (Cần rà soát)</text>
    <text x="785" y="729.775" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7F1D1D">Chặn xuất báo cáo chính thức</text></g>
  <g id="io_out"><polygon points="296,782 620,782 604,836 280,836" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
    <text x="450" y="805.2" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Xuất kết quả chính thức kèm căn cứ pháp lý</text>
    <text x="450" y="821.2" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">&amp; lưu vào bảng du_an (ket_qua_phan_loai)</text></g>
  <g id="end"><rect x="685" y="788" width="200" height="42" rx="21" ry="21" fill="#DCFCE7" stroke="#15803D" stroke-width="1.6"/>
    <text x="785" y="813.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">Kết thúc</text></g>

