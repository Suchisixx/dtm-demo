  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">SƠ ĐỒ 2.7. LƯU ĐỒ CẬP NHẬT VĂN BẢN PHÁP LUẬT (CRAWLER)</text>
  <text x="480" y="54" text-anchor="middle" font-size="12" fill="#4B5563">Admin kích hoạt thủ công trên Web (auto_crawl mặc định tắt), đối chiếu Sitemap lastmod, bóc tách Cheerio &amp; tạo đề xuất duyệt</text>

